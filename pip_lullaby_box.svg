<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip lullaby music box">
  <defs>
    <filter id="music-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="15" y="30" width="70" height="45" rx="8" fill="#292448" stroke="#C8B8F0" stroke-width="2"/>
  <rect x="20" y="35" width="60" height="35" rx="5" fill="#17172F"/>
  <circle cx="50" cy="52" r="12" fill="#C8B8F0" opacity="0.3" stroke="#C8B8F0" stroke-width="1.5"/>
  <polygon points="45,46 45,58 57,52" fill="#FFC875" filter="url(#music-glow)"/>
  <rect x="25" y="24" width="50" height="10" rx="5" fill="#292448" stroke="#C8B8F0" stroke-width="1.5"/>
  <circle cx="50" cy="29" r="3" fill="#F4A7C8"/>
  <text x="26" y="78" font-size="7" fill="#C8B8F0">♪ ♫ ♩ ♬</text>
</svg>
