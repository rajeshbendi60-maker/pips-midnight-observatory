<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip dream lantern">
  <defs>
    <filter id="lantern-light">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="40" y1="0" x2="40" y2="15" stroke="#C8B8F0" stroke-width="3" stroke-linecap="round"/>
  <rect x="20" y="10" width="40" height="5" rx="2" fill="#C8B8F0" opacity="0.8"/>
  <path d="M22,15 L18,80 L62,80 L58,15 Z" fill="#292448" stroke="#C8B8F0" stroke-width="2"/>
  <path d="M25,18 L21,77 L59,77 L55,18 Z" fill="#17172F" opacity="0.85"/>
  <!-- Lantern flame / glow -->
  <ellipse cx="40" cy="48" rx="16" ry="24" fill="#FFC875" opacity="0.35" filter="url(#lantern-light)"/>
  <circle cx="40" cy="48" r="10" fill="#FFC875" opacity="0.85" filter="url(#lantern-light)"/>
  <circle cx="40" cy="48" r="4" fill="#FFFFFF"/>
  <rect x="20" y="78" width="40" height="8" rx="4" fill="#C8B8F0" opacity="0.8"/>
</svg>
