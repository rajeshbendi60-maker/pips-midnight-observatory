<svg viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pip the Skull Baby floating on a cloud">
  <defs>
    <filter id="pip-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Nightcap (midnight violet with gold star tip) -->
  <polygon points="80,10 55,65 105,65" fill="#292448" />
  <circle cx="80" cy="10" r="7" fill="#FFC875" filter="url(#pip-glow)" />
  <!-- Stars on nightcap -->
  <text x="74" y="42" font-size="8" fill="#FFC875">★</text>
  <text x="82" y="30" font-size="5" fill="#C8B8F0">✦</text>

  <!-- Pink bow on cap -->
  <ellipse cx="62" cy="55" rx="10" ry="6" fill="#F4A7C8" transform="rotate(-20,62,55)" />
  <ellipse cx="70" cy="55" rx="10" ry="6" fill="#F4A7C8" transform="rotate(20,70,55)" />
  <circle cx="66" cy="55" r="4" fill="#e87bb5" />

  <!-- Smooth round skull face -->
  <ellipse cx="80" cy="105" rx="42" ry="45" fill="#FFF5E9" stroke="#E6DCCE" stroke-width="1.5" />

  <!-- Soft large eye sockets -->
  <ellipse cx="64" cy="100" rx="13" ry="14" fill="#292448" />
  <ellipse cx="96" cy="100" rx="13" ry="14" fill="#292448" />

  <!-- Warm amber pinpoints with twinkle -->
  <circle cx="64" cy="100" r="4" fill="#FFC875" filter="url(#pip-glow)" />
  <circle cx="96" cy="100" r="4" fill="#FFC875" filter="url(#pip-glow)" />
  <circle cx="62" cy="98" r="1.5" fill="#FFFFFF" />
  <circle cx="94" cy="98" r="1.5" fill="#FFFFFF" />

  <!-- Tiny crooked smile -->
  <path d="M72,122 Q80,130 88,122" stroke="#292448" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Cute rosy cheeks -->
  <ellipse cx="52" cy="116" rx="9" ry="5" fill="#F4A7C8" opacity="0.45" />
  <ellipse cx="108" cy="116" rx="9" ry="5" fill="#F4A7C8" opacity="0.45" />

  <!-- Dream Cloud base -->
  <g opacity="0.9">
    <ellipse cx="80" cy="155" rx="52" ry="22" fill="#C8B8F0" opacity="0.4" />
    <ellipse cx="52" cy="148" rx="28" ry="18" fill="#C8B8F0" opacity="0.5" />
    <ellipse cx="108" cy="148" rx="28" ry="18" fill="#C8B8F0" opacity="0.5" />
    <ellipse cx="80" cy="142" rx="36" ry="22" fill="#FFFFFF" opacity="0.88" />
  </g>
</svg>
